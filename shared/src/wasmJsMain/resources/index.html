<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="alternate icon" href="favicon.ico">
    <title>Lojinha Admin Console</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .loading-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            z-index: 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #1e3a8a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-title {
            margin-top: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
        }
        .loading-sub {
            margin-top: 6px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
    <script type="application/javascript" src="lojinha.js"></script>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-title">Lojinha Admin Console</div>
        <div class="loading-sub">Loading WebAssembly application...</div>
    </div>
    <canvas id="ComposeTarget"></canvas>
</body>
</html>
